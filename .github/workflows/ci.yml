name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.2
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Compile the Modgud binary
        # bash runs with pipefail, so a binary that prints the line and then fails still fails the step.
        shell: bash
        run: |
          bun run build
          ./dist/modgud --version | grep -E '^modgud v[0-9]+\.[0-9]+\.[0-9]+$'
